spring.application.name=ms-productos
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.username=${DB_USER:pedidos}
# Sin valor por defecto a proposito: si DB_PASS no esta definida, el
# servicio falla al arrancar en vez de conectarse con una contrasena
# conocida que quedaria versionada en este archivo.
spring.datasource.password=${DB_PASS}

# Boot 4.x: la creacion del esquema JPA se detecta automaticamente como
# inicializador de base de datos (JpaDatabaseInitializerDetector), asi que
# data.sql se ejecuta despues sin necesidad del antiguo
# spring.jpa.defer-datasource-initialization. Solo hace falta forzar el modo
# porque Postgres no es una base embebida.
#
# "update" y no "create-drop": con create-drop el esquema se borraba al
# apagar el servicio, asi que todo lo que un Admin creara o editara desde la
# vista de administracion desaparecia al reiniciar. Como data.sql ahora se
# ejecuta en cada arranque (el esquema ya no se recrea), la semilla esta
# escrita para insertarse solo si la tabla esta vacia.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
