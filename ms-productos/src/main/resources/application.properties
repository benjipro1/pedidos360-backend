spring.application.name=ms-productos
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.username=${DB_USER:pedidos}
# Sin valor por defecto a proposito: si DB_PASS no esta definida, el
# servicio falla al arrancar en vez de conectarse con una contrasena
# conocida que quedaria versionada en este archivo.
spring.datasource.password=${DB_PASS}

# Boot 4.x: la creacion del esquema JPA se detecta automaticamente como
# inicializador de base de datos (JpaDatabaseInitializerDetector), asi que
# data.sql se ejecuta despues sin necesidad del antiguo
# spring.jpa.defer-datasource-initialization. Solo hace falta forzar el modo
# porque Postgres no es una base embebida.
#
# "update" y no "create-drop": con create-drop el esquema se borraba al
# apagar el servicio, asi que todo lo que un Admin creara o editara desde la
# vista de administracion desaparecia al reiniciar. Como data.sql ahora se
# ejecuta en cada arranque (el esquema ya no se recrea), la semilla esta
# escrita para insertarse solo si la tabla esta vacia.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health

# --- Kafka (EP5): ms-productos CONSUME inventario.movimientos ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
# Prefijo de los client.id: en Kafka UI cada hilo aparece como ms-productos-N.
spring.kafka.client-id=ms-productos
# Un group nuevo (o sin offsets) parte desde el primer mensaje retenido, asi
# no se pierden movimientos publicados mientras el servicio estaba abajo.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
# Rebalanceo cooperativo: al entrar o salir un consumidor solo se mueven las
# particiones necesarias, sin detener a todo el grupo.
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
# Commit del offset despues de cada mensaje procesado con exito.
spring.kafka.listener.ack-mode=record
# Productor que usa el error handler para escribir en los DLT.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

kafka.topicos.movimientos=inventario.movimientos
kafka.grupos.stock=productos-stock
# Un hilo consumidor por particion (los topicos tienen 3).
kafka.consumidores.concurrencia=3
