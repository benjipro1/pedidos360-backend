spring.application.name=bff
server.port=8080

# Valores del tenant de Entra ID documentados en CLAUDE.md (no son
# secretos: identifican el tenant/app, no autentican nada por si solos).
# Sobreescribibles por variable de entorno para produccion.
jwt.issuer=${JWT_ISSUER:https://login.microsoftonline.com/baffd3de-6d87-4351-b113-0276e469ae8d/v2.0}
jwt.jwks-uri=${JWT_JWKS_URI:https://login.microsoftonline.com/baffd3de-6d87-4351-b113-0276e469ae8d/discovery/v2.0/keys}
jwt.audience=${JWT_AUDIENCE:b5c90e11-373c-4846-a4e0-5440187d52de}

app.productos-url=${PRODUCTOS_URL:http://localhost:8081}
app.pedidos-url=${PEDIDOS_URL:http://localhost:8082}

# No configurar CORS aca: en produccion lo maneja el API Gateway (ver
# README/CLAUDE.md, seccion CORS); en local se evita con el proxy de
# Angular.
management.endpoints.web.exposure.include=health
