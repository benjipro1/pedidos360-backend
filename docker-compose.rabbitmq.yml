# Cluster RabbitMQ de 2 nodos (Parcial 2). Es la misma topologia que corre
# en la EC2 backend: rabbitmq-1 y rabbitmq-2 sobre RabbitMQ 4.3.6.
#
#   docker compose -f docker-compose.rabbitmq.yml up -d
#   docker exec rabbitmq-1 rabbitmqctl cluster_status
#
# Puertos en el host (en la EC2 NO estan abiertos en el security group: la
# consola se usa por tunel SSH):
#   rabbitmq-1 -> AMQP 5672, consola 15672
#   rabbitmq-2 -> AMQP 5673, consola 15673
#
# Variables obligatorias en .env: RABBITMQ_PASSWORD y RABBITMQ_ERLANG_COOKIE.
# Exchanges, colas y DLQ NO se declaran aqui: los crea ms-mensajeria al
# arrancar (TopologyInitializer).

x-rabbitmq-node: &rabbitmq-node
  image: rabbitmq:4.3.6-management
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: admin
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?definir RABBITMQ_PASSWORD en .env}
    ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?definir RABBITMQ_ERLANG_COOKIE en .env}
  # Los nodos de un cluster deben compartir la misma cookie de Erlang. Se
  # escribe como archivo con permisos 600 antes de arrancar: es la forma
  # soportada en 4.x (la variable RABBITMQ_ERLANG_COOKIE esta deprecada) y
  # evita los problemas de permisos de montar el archivo desde Windows.
  entrypoint: >
    sh -c 'printf "%s" "$$ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie &&
           chmod 600 /var/lib/rabbitmq/.erlang.cookie &&
           chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie &&
           exec docker-entrypoint.sh rabbitmq-server'
  volumes:
    - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 10
  networks:
    - rabbitmq

services:
  rabbitmq-1:
    <<: *rabbitmq-node
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"

  rabbitmq-2:
    <<: *rabbitmq-node
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbitmq-1:
        condition: service_healthy

networks:
  rabbitmq:
    name: pedidos360-rabbitmq
