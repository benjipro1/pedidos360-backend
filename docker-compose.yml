services:
  postgres:
    image: postgres:16
    container_name: pedidos360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: ${DB_PASS:?definir DB_PASS en .env antes de levantar la base}
    ports:
      # Puerto del host configurable: si ya tienes un PostgreSQL instalado
      # en la maquina, ocupa el 5432 y las conexiones nunca llegan a este
      # contenedor. En ese caso define DB_PORT (por ejemplo 5433) en .env,
      # y usa ese mismo puerto en DB_URL.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pedidos360-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos360"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pedidos360-pgdata:
