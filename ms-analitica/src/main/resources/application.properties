spring.application.name=ms-analitica
server.port=8084

management.endpoints.web.exposure.include=health

# --- Kafka (EP5): ms-analitica CONSUME los dos topicos ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-analitica
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.listener.ack-mode=record
# Productor que usa el error handler para escribir en los DLT.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

kafka.topicos.pedidos=pedidos.eventos
kafka.topicos.movimientos=inventario.movimientos
# Dos consumer groups distintos: cada uno lleva sus propios offsets y lee
# TODOS los mensajes de su topico, independiente de productos-stock.
kafka.grupos.ventas=analitica-ventas
kafka.grupos.inventario=analitica-inventario
kafka.consumidores.concurrencia=3

# Replay: al arrancar, cada consumidor vuelve al inicio de sus particiones y
# reconstruye los KPIs (estado en memoria) a partir de los eventos retenidos
# (7 dias en pedidos.eventos, 30 en inventario.movimientos).
analitica.replay-al-iniciar=true
