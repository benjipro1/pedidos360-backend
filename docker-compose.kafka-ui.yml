# Kafka UI (kafbat/kafka-ui, el fork mantenido de provectus/kafka-ui) para
# administrar brokers, topicos, particiones, mensajes y consumer groups.
#
#   docker compose -f docker-compose.kafka.yml up -d      (primero el cluster)
#   docker compose -f docker-compose.kafka-ui.yml up -d
#   http://localhost:8090
#
# Puerto 8090 para no chocar con el BFF (:8080). Se une a la red que crea
# docker-compose.kafka.yml y habla con los brokers por el listener INTERNAL.
# En la nube corre en la EC2 kafka-1: ver infra/kafka-cloud/.

services:
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      # Permite crear/editar topicos y configs desde la interfaz.
      KAFKA_CLUSTERS_0_READONLY: "false"
      JAVA_OPTS: ${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx256m}
    networks:
      - kafka

networks:
  kafka:
    name: pedidos360-kafka
    external: true
