spring.application.name=ms-pedidos
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.username=${DB_USER:pedidos}
# Sin valor por defecto a proposito: si DB_PASS no esta definida, el
# servicio falla al arrancar en vez de conectarse con una contrasena
# conocida que quedaria versionada en este archivo.
spring.datasource.password=${DB_PASS}

# No hay data.sql en este servicio, asi que no se necesita el ajuste de
# orden de inicializacion que usa ms-productos: "update" preserva los
# pedidos entre reinicios en dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
