spring.application.name=ms-pedidos
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.username=${DB_USER:pedidos}
# Sin valor por defecto a proposito: si DB_PASS no esta definida, el
# servicio falla al arrancar en vez de conectarse con una contrasena
# conocida que quedaria versionada en este archivo.
spring.datasource.password=${DB_PASS}

# No hay data.sql en este servicio, asi que no se necesita el ajuste de
# orden de inicializacion que usa ms-productos: "update" preserva los
# pedidos entre reinicios en dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health

# --- RabbitMQ (EP3): ms-pedidos solo PUBLICA eventos, no consume nada ---
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Mismos nombres de exchange que declara ms-mensajeria (deben coincidir exacto)
rabbitmq.exchanges.direct=pedidos.direct.exchange
rabbitmq.exchanges.topic=pedidos.topic.exchange
rabbitmq.routing-keys.pedido-creado=pedido.creado
rabbitmq.routing-keys.pedido-pagado=pedido.pagado

# --- Kafka (EP5): ms-pedidos solo PRODUCE eventos ---
# Lista de los 3 brokers: si uno no responde, el cliente obtiene la metadata
# del cluster desde otro.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Serializer JSON de Spring Kafka 4 basado en Jackson 3.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Sin cabeceras __TypeId__: cada consumidor deserializa al DTO de SU propio
# paquete, asi los servicios no quedan acoplados por nombres de clase.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Durabilidad: el broker confirma solo cuando el mensaje esta en todas las
# replicas en sincronia (min.insync.replicas=2 en los topicos).
spring.kafka.producer.acks=all
# Idempotencia: los reintentos del productor no duplican mensajes en el log.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=5
# Best effort: si Kafka no esta disponible, send() espera como maximo 3 s
# por metadata (no 60 s, el default) y el envio se abandona a los 15 s.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000

kafka.topicos.pedidos=pedidos.eventos
kafka.topicos.movimientos=inventario.movimientos
